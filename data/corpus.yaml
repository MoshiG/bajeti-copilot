# Bajeti Copilot corpus manifest.
#
# Every document the copilot can cite is listed here with where it came from. Nothing is
# committed to git; `make fetch` downloads into data/raw/ and records a SHA-256 for each file
# in data/raw/manifest.lock.json so a run can be reproduced exactly.
#
# Source kinds:
#   url:          a direct PDF link
#   dspace_item:  a Ministry of Finance repository item (repository.mof.go.tz); the script asks
#                 the repository's REST API for the file whose name contains `file_match`.
#                 Prefer a direct www.mof.go.tz link when one exists: the repository server
#                 often cuts downloads short.
#   manual: true  no stable link yet; download it from `page` and save as data/raw/<id>.pdf
#
# Fields: id, title, doc_type (speech | finance_act | estimates), fiscal_year, language (sw | en)

repository_api: "https://repository.mof.go.tz/server/api"

