name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swa
      - run: pip install -e ".[dev,ingest,index,ui]"
      - run: ruff check src tests
      - run: pytest --cov=bajeti --cov-report=term-missing
